[PHP]
; Memory and execution limits for Magento 2
memory_limit = 2G
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000

; File uploads
upload_max_filesize = 64M
post_max_size = 64M

; Display errors (disable in production)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php-fpm/error.log

; Session settings
session.save_handler = redis
session.save_path = "tcp://redis:6379/2?weight=1&timeout=86400&database=2"
session.gc_maxlifetime = 1440
session.gc_divisor = 1000
session.gc_probability = 1

; Extensions
extension = redis
extension = mysqli
extension = pdo_mysql
extension = intl
extension = xsl
extension = soap
extension = bcmath

; Date/Time
date.timezone = UTC

; Default charset
default_charset = "UTF-8"

; Disable dangerous functions
disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_kill,pcntl_async_signals,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_get_child_status

; OPcache (configured in opcache.ini)
; See /usr/local/etc/php/conf.d/opcache.ini
