upstream varnish_backend {
    server varnish:6081;
}

upstream php_backend {
    server php-fpm:9000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name test.dyna.com www.test.dyna.com;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.dyna.com www.test.dyna.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/certs/test.dyna.com.crt;
    ssl_certificate_key /etc/nginx/certs/test.dyna.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    root /var/www/html/pub;
    index index.php;

    # Magento static & media files
    location ~* ^/static/(?!adminhtml/)[^/]*/(?!cache)[^/]*/.*\.(jpg|jpeg|png|gif|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Magento-Cache-Debug "HIT";
    }

    location ~* ^/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/media/ {
        expires 1y;
        add_header Cache-Control "public";
        add_header X-Magento-Cache-Debug "HIT";
    }

    # Block access to sensitive files
    location ~* (^/app/|^/includes/|^/lib/|^/media/downloadable/|^/pkginfo/|^/report/|^/var/|\.php$|mage\.php|\.htaccess|\.htpasswd|\.git|\.gitignore) {
        deny all;
        return 404;
    }

    # Varnish for caching (cacheable content)
    location / {
        proxy_pass http://varnish_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # Add debug header
        add_header X-Magento-Cache-Debug $http_x_magento_cache_debug always;
    }

    # PHP-FPM for dynamic requests (POST, admin, etc.)
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri;
        fastcgi_param QUERY_STRING $args;
        fastcgi_buffering on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 900s;
    }

    # phpMyAdmin on /pma/
    location /pma/ {
        proxy_pass http://phpmyadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Basic Auth for phpMyAdmin
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
