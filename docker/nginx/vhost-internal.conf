# Internal HTTP server for Varnish backend (port 8080)
server {
    listen 8080;
    server_name test.dyna.com www.test.dyna.com;

    root /var/www/html/pub;
    index index.php;

    charset utf-8;

    # Security
    location ~ /\. {
        deny all;
    }

    location ~* ^/(app|includes|lib|pkginfo|report|var)/ {
        deny all;
        return 404;
    }

    # Static content
    location /static/ {
        location ~ ^/static/version\d*/ {
            rewrite ^/static/version\d*/(.*)$ /static/$1 last;
        }

        try_files $uri $uri/ /static.php?resource=$uri;
        expires max;
        access_log off;
    }

    # Media
    location /media/ {
        try_files $uri $uri/ /get.php?$args;
        expires max;
        access_log off;
    }

    # Main Magento entry point
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP processing
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param MAGE_RUN_CODE default;
        fastcgi_param MAGE_RUN_TYPE store;

        # HTTPS handling
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 900s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}
